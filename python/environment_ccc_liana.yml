# LIANA (Python) — separate env; do NOT mix with qiskit-env.
# Create:  conda env create -f environment_ccc_liana.yml
# Run:     conda activate ccc-liana && python benchmark_LIANA_py/liana_benchmark.py
name: ccc-liana
channels: [conda-forge, bioconda, defaults]
dependencies:
  - python=3.11
  - pip
  - numpy
  - pandas
  - scipy
  - scanpy>=1.10
  - anndata>=0.10
  - h5py
  - hdf5plugin
  - matplotlib
  - pip:
      - liana>=1.4
      - decoupler
      - pydeseq2
